<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d9482b" />
  <title>ห่าวเลอ — เรียนภาษาจีนวันละนิด</title>
  <meta name="description" content="แอปสอนภาษาจีนสำหรับผู้เริ่มต้น ฝึกคำศัพท์ การออกเสียง และทำแบบทดสอบสั้น ๆ" />
  <style>
    :root{--ink:#241d19;--muted:#746861;--paper:#fffaf2;--card:#fff;--red:#d9482b;--red2:#b92f1d;--gold:#f4b63e;--line:#eadfd3;--green:#2c7a58;--shadow:0 18px 45px rgba(91,54,34,.11)}
    *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans Thai","Leelawadee UI","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#d9482b12 1px,transparent 1px);background-size:24px 24px}
    button{font:inherit} .shell{max-width:1180px;margin:auto;padding:24px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.seal{width:44px;height:44px;border-radius:13px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:25px;font-family:serif;box-shadow:0 8px 20px #d9482b35}.brand h1{font-size:20px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:13px}.streak{background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:700;color:var(--red)}
    .grid{display:grid;grid-template-columns:240px 1fr;gap:22px}.side,.main-card{background:rgba(255,255,255,.9);border:1px solid var(--line);box-shadow:var(--shadow)}.side{border-radius:22px;padding:16px;height:max-content}.nav-title{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:4px 8px 10px}.lesson{width:100%;border:0;background:transparent;border-radius:14px;padding:12px;text-align:left;display:flex;gap:11px;align-items:center;cursor:pointer;color:var(--ink);margin:3px 0}.lesson:hover{background:#fff4e7}.lesson.active{background:#fff0e8;color:var(--red2);font-weight:800}.num{width:30px;height:30px;border-radius:10px;background:#f2e8de;display:grid;place-items:center;font-size:13px}.active .num{background:var(--red);color:#fff}.done .num{background:#e1f2e9;color:var(--green)}
    .progress-box{margin-top:18px;background:#2c2420;color:#fff;border-radius:16px;padding:16px}.progress-box p{font-size:13px;color:#d7cbc4;margin:0 0 9px}.track{height:8px;background:#50443d;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:var(--gold);transition:.3s}.progress-box strong{display:block;margin-top:9px;font-size:13px}
    .main-card{border-radius:28px;overflow:hidden}.hero{padding:34px 38px 28px;background:linear-gradient(135deg,#fff 55%,#fff0df)}.eyebrow{color:var(--red);font-weight:800;font-size:13px;letter-spacing:.06em}.hero h2{font-size:clamp(27px,4vw,42px);margin:8px 0 7px;line-height:1.16}.hero p{margin:0;color:var(--muted);font-size:16px}.content{padding:28px 38px 38px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.section-head h3{margin:0;font-size:19px}.section-head span{color:var(--muted);font-size:13px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.word{border:1px solid var(--line);border-radius:18px;padding:19px;background:#fff;cursor:pointer;transition:.2s;text-align:left}.word:hover,.word:focus{transform:translateY(-3px);border-color:#efab9b;box-shadow:0 10px 22px #8c4a2915;outline:none}.hanzi{font-family:"Microsoft YaHei",sans-serif;font-size:34px;font-weight:700;color:var(--red2)}.pinyin{font-weight:800;margin-top:7px}.meaning{color:var(--muted);font-size:14px}.speak{float:right;color:var(--red);font-size:19px}
    .teach{margin-top:28px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:10px 16px;font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:#2c2420;color:#fff;border-color:#2c2420}.teach-panel{margin-top:13px;border:1px solid var(--line);border-radius:19px;padding:20px;background:#fffaf5}.teach-panel h4{font-size:18px;margin:0 0 6px}.teach-panel>p{color:var(--muted);margin:0 0 16px;line-height:1.65}.tones{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tone{border:1px solid #efcbbf;background:#fff;border-radius:14px;padding:13px 8px;cursor:pointer;text-align:center}.tone:hover{border-color:var(--red);background:#fff4ef}.tone b{display:block;color:var(--red2);font-size:23px}.tone small{color:var(--muted)}.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.piece{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:800}.plus{color:var(--muted)}.example{margin-top:14px;background:#fff;border-left:4px solid var(--gold);padding:12px 15px;border-radius:0 12px 12px 0}.example b{font-family:"Microsoft YaHei",sans-serif;font-size:19px}.tip{margin-top:12px;color:var(--green);font-weight:700;font-size:14px}
    .quiz{margin-top:26px;border-top:1px solid var(--line);padding-top:24px}.question{font-size:19px;font-weight:800;margin:7px 0 15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;cursor:pointer;color:var(--ink)}.choice:hover{border-color:var(--red)}.choice.correct{background:#eaf7f0;border-color:var(--green);color:var(--green)}.choice.wrong{background:#fff0ed;border-color:var(--red);color:var(--red)}.feedback{min-height:27px;margin:13px 0 0;font-weight:700}.next{border:0;border-radius:13px;background:var(--red);color:#fff;padding:12px 19px;font-weight:800;cursor:pointer;box-shadow:0 7px 16px #d9482b3b}.next:hover{background:var(--red2)}
    @media(max-width:760px){.shell{padding:14px}.grid{grid-template-columns:1fr}.side{padding:10px}.nav-title,.progress-box{display:none}.lessons{display:flex;overflow:auto;gap:5px}.lesson{min-width:max-content;width:auto}.hero,.content{padding:24px}.cards{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.tones{grid-template-columns:repeat(3,1fr)}.brand p{display:none}.main-card{border-radius:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="seal">好</div><div><h1>ห่าวเลอ</h1><p>ภาษาจีนที่ใช้ได้จริง ทุกวัน</p></div></div><div class="streak">🔥 <span id="streak">1</span> วัน</div></header>
    <a href="./hsk.html" style="display:block;background:#2c2420;color:#fff;padding:18px 22px;border-radius:16px;margin-bottom:20px;text-decoration:none;font-weight:700">คลังศัพท์ HSK 3.0 ระดับ 1–5 · 3,600 รายการ →</a>
    <div class="grid">
      <aside class="side"><div class="nav-title">บทเรียน</div><div class="lessons" id="lessons"></div><div class="progress-box"><p>ความก้าวหน้าวันนี้</p><div class="track"><div class="bar" id="bar"></div></div><strong id="progressText">0 / 5 คำ</strong></div></aside>
      <section class="main-card"><div class="hero"><div class="eyebrow" id="unit">บทที่ 1 · พื้นฐาน</div><h2 id="title">ทักทายกันเถอะ</h2><p id="subtitle">แตะคำศัพท์เพื่อฟังการออกเสียง แล้วลองตอบคำถาม</p></div><div class="content"><div class="section-head"><h3>คำศัพท์วันนี้</h3><span>แตะ 🔊 เพื่อฟัง</span></div><div class="cards" id="cards"></div><section class="teach"><div class="section-head"><h3>พื้นฐานที่ต้องรู้</h3><span>ฟัง · อ่าน · สร้างประโยค</span></div><div class="tabs"><button class="tab active" onclick="showTeach('tone',this)">การออกเสียง</button><button class="tab" onclick="showTeach('pinyin',this)">พินอิน</button><button class="tab" onclick="showTeach('grammar',this)">หลักไวยากรณ์</button></div><div class="teach-panel" id="teachPanel"></div></section><div class="quiz"><div class="eyebrow">ลองตอบดู</div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="next" id="next" hidden>คำถัดไป →</button></div></div></section>
    </div>
  </main>
  <script>
    const data=[
      {title:'ทักทายกันเถอะ',unit:'บทที่ 1 · พื้นฐาน',words:[['你好','nǐ hǎo','สวัสดี'],['谢谢','xiè xie','ขอบคุณ'],['再见','zài jiàn','ลาก่อน'],['对不起','duì bu qǐ','ขอโทษ'],['没关系','méi guān xi','ไม่เป็นไร']]},
      {title:'แนะนำตัว',unit:'บทที่ 2 · รู้จักกัน',words:[['我','wǒ','ฉัน'],['你','nǐ','คุณ'],['名字','míng zi','ชื่อ'],['泰国人','Tài guó rén','คนไทย'],['很高兴','hěn gāo xìng','ยินดีมาก']]},
      {title:'ตัวเลข 1–5',unit:'บทที่ 3 · ตัวเลข',words:[['一','yī','หนึ่ง'],['二','èr','สอง'],['三','sān','สาม'],['四','sì','สี่'],['五','wǔ','ห้า']]},
      {title:'อาหารและเครื่องดื่ม',unit:'บทที่ 4 · ร้านอาหาร',words:[['水','shuǐ','น้ำ'],['茶','chá','ชา'],['米饭','mǐ fàn','ข้าวสวย'],['面条','miàn tiáo','บะหมี่'],['好吃','hǎo chī','อร่อย']]}
    ];
    function readProgress(){try{const saved=JSON.parse(localStorage.getItem('learned')||'[]');return new Set(Array.isArray(saved)?saved.filter(i=>Number.isInteger(i)&&i>=0&&i<data.length):[])}catch{return new Set()}}
    let lesson=0,q=0,learned=readProgress();
    const el=id=>document.getElementById(id);
    let speech=null,speechTimer=null,voiceList=[];
    function soundStatus(message){el('soundStatus').textContent=message}
    let audioPlayer=null,audioText='',audioRequest=0;
    function stopSpeech(){audioRequest++;if(audioPlayer){audioPlayer.pause();audioPlayer.removeAttribute('src');audioPlayer.load();audioPlayer=null}audioText='';clearTimeout(speechTimer);speech=null;if('speechSynthesis'in window)window.speechSynthesis.cancel()}
    function loadVoices(){voiceList=window.speechSynthesis.getVoices()}
    function speak(text){
      if(audioPlayer&&audioText===text)return;
      stopSpeech();const request=audioRequest;
      const mode=Number(el('speechRate').value)<.8?'slow':'normal';
      const filename=Array.from(text,c=>c.codePointAt(0).toString(16)).join('-');
      const player=new Audio('./audio/'+filename+'-'+mode+'.mp3');audioPlayer=player;audioText=text;
      soundStatus('กำลังโหลดเสียง '+text+'…');
      const failed=()=>{if(request!==audioRequest)return;stopSpeech();soundStatus('โหลดเสียงไม่ได้ ตรวจอินเทอร์เน็ตแล้วแตะเพื่อลองอีกครั้ง')};
      speechTimer=setTimeout(failed,15000);
      player.onplaying=()=>{if(request===audioRequest){clearTimeout(speechTimer);soundStatus('กำลังอ่าน '+text)}};
      player.onended=()=>{if(request===audioRequest){stopSpeech();soundStatus('อ่านจบแล้ว แตะเพื่อฟังซ้ำได้')}};
      player.onerror=failed;
      player.play().catch(failed);
    }
    const soundPanel=document.createElement('section');soundPanel.style.cssText='padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:20px';
    soundPanel.innerHTML='<label for="speechRate">ความเร็วเสียง </label><select id="speechRate" style="font:inherit;padding:8px"><option value="0.9">ธรรมชาติ</option><option value="0.7">ช้า · ฝึกพูดตาม</option></select> <button class="tab" onclick="speak(\'你好\')">ทดสอบเสียง</button> <button class="tab" onclick="stopSpeech();soundStatus(\'หยุดเสียงแล้ว\')">หยุด</button><p id="soundStatus" role="status" aria-live="polite" style="margin:10px 0 0;min-height:26px">แตะคำศัพท์เพื่อฟัง เสียงขึ้นอยู่กับเสียงภาษาจีนที่มีในเครื่อง</p>';
    document.querySelector('.content').prepend(soundPanel);
    soundStatus('เสียงจีน Neural · เลือกโหมดช้าเพื่อฝึกพูดตาม');
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});
    const teachContent={
      tone:`<h4>เสียงวรรณยุกต์ 4 เสียง + เสียงเบา</h4><p>ระดับเสียงทำให้ความหมายเปลี่ยน แตะแต่ละคำเพื่อฟังและพูดตามช้า ๆ</p><div class="tones"><button class="tone" onclick="speak('妈')"><b>mā</b><small>เสียง 1 สูงราบ</small></button><button class="tone" onclick="speak('麻')"><b>má</b><small>เสียง 2 สูงขึ้น</small></button><button class="tone" onclick="speak('马')"><b>mǎ</b><small>เสียง 3 ต่ำแล้วขึ้น</small></button><button class="tone" onclick="speak('骂')"><b>mà</b><small>เสียง 4 ตกแรง</small></button><button class="tone" onclick="speak('吗')"><b>ma</b><small>เสียงเบา</small></button></div><div class="tip">เคล็ดลับ: ฟังหนึ่งครั้ง แล้วพูดตามโดยเลียนแบบระดับเสียง ไม่ใช่แค่อ่านตัวสะกด</div>`,
      pinyin:`<h4>พินอินประกอบด้วยอะไร?</h4><p>พินอินคือระบบเขียนเสียงภาษาจีนด้วยอักษรโรมัน หนึ่งพยางค์มักประกอบด้วยเสียงต้น เสียงท้าย และวรรณยุกต์</p><div class="formula"><span class="piece">n · เสียงต้น</span><span class="plus">+</span><span class="piece">i · เสียงท้าย</span><span class="plus">+</span><span class="piece">ˇ · เสียง 3</span><span class="plus">=</span><span class="piece">nǐ 你</span></div><div class="example"><b>hǎo 好</b><br>h = เสียงต้น · ao = เสียงท้าย · ˇ = เสียงที่ 3</div><div class="tip">เครื่องหมายเสียงวางบนสระหลัก: a ก่อนเสมอ จากนั้น o, e, i, u, ü</div>`,
      grammar:`<h4>โครงสร้างประโยคพื้นฐาน</h4><p>ภาษาจีนเรียงคำคล้ายภาษาไทย: ประธาน + กริยา + กรรม และคำกริยาไม่ผันตามประธาน</p><div class="formula"><span class="piece">我 ฉัน</span><span class="plus">+</span><span class="piece">喜欢 ชอบ</span><span class="plus">+</span><span class="piece">茶 ชา</span></div><div class="example"><button class="speak" onclick="speak('我喜欢茶')" aria-label="ฟังประโยค">🔊</button><b>我喜欢茶。</b><br><span class="pinyin">Wǒ xǐhuan chá.</span><br><span class="meaning">ฉันชอบชา</span></div><div class="tip">ทำเป็นคำถามแบบใช่/ไม่ใช่ได้ด้วยการเติม 吗 (ma) ท้ายประโยค</div>`
    };
    function showTeach(type,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');el('teachPanel').innerHTML=teachContent[type]}
    function renderNav(){el('lessons').innerHTML=data.map((x,i)=>`<button class="lesson ${i===lesson?'active':''} ${learned.has(i)?'done':''}" onclick="openLesson(${i})"><span class="num">${learned.has(i)?'✓':i+1}</span><span>${x.title}</span></button>`).join('')}
    function openLesson(i){lesson=i;q=0;el('unit').textContent=data[i].unit;el('title').textContent=data[i].title;el('cards').innerHTML=data[i].words.slice(0,3).map(w=>`<button class="word" onclick="speak('${w[0]}')"><span class="speak">🔊</span><div class="hanzi">${w[0]}</div><div class="pinyin">${w[1]}</div><div class="meaning">${w[2]}</div></button>`).join('');renderNav();renderQuiz()}
    function renderQuiz(){const words=data[lesson].words,target=words[q%words.length];el('question').textContent=`“${target[0]}” แปลว่าอะไร?`;let opts=[target,...words.filter(x=>x!==target).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);el('choices').innerHTML=opts.map(x=>`<button class="choice" onclick="answer(this,'${x[2].replaceAll("'","\\'")}','${target[2].replaceAll("'","\\'")}')">${x[2]}</button>`).join('');el('feedback').textContent='';el('next').hidden=true}
    function answer(btn,value,correct){if(btn.disabled)return;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct')});if(value===correct){el('feedback').textContent='เก่งมาก! 很好 (hěn hǎo) 🎉';learned.add(lesson);try{localStorage.setItem('learned',JSON.stringify([...learned]))}catch{el('feedback').textContent+=' (เครื่องนี้บันทึกความก้าวหน้าไม่ได้)'}updateProgress();renderNav()}else{btn.classList.add('wrong');el('feedback').textContent=`เกือบแล้ว คำตอบคือ “${correct}”`};el('next').hidden=false}
    el('next').onclick=()=>{if(el('next').hidden)return;el('next').hidden=true;q=(q+1)%data[lesson].words.length;renderQuiz()};
    document.querySelector('.lessons').addEventListener('click',()=>{stopSpeech();soundStatus('แตะคำศัพท์เพื่อฟัง')},true);
    function updateProgress(){el('bar').style.width=(learned.size/data.length*100)+'%';el('progressText').textContent=`${learned.size} / ${data.length} บท`}
    window.openLesson=openLesson;window.speak=speak;window.answer=answer;window.showTeach=showTeach;renderNav();updateProgress();openLesson(0);showTeach('tone',document.querySelector('.tab'));
  </script>
</body>
</html>
